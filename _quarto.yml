---
project:
  type: website
  output-dir: docs
  # GitHub Pages reads docs/CNAME (custom domain) and docs/.nojekyll (skip Jekyll).
  # Listing them here makes Quarto copy them on every render instead of deleting them.
  resources:
    - CNAME
    - .nojekyll

website:
  title: "Stefan Voigt"
  site-url: https://www.voigtstefan.me/
  description: "Personal website of Stefan Voigt, Associate Professor of Finance at the University of Copenhagen"
  open-graph: true
  search: false
  navbar:
    left:
      - href: index.qmd#working-papers
        text: Working papers
      - href: index.qmd#publications
        text: Publications
      - href: index.qmd#teaching
        text: Teaching
      - text: CV
        href: documents/CV-SV.pdf

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    section-divs: true
    number-sections: false
    anchor-sections: true
    smooth-scroll: true
    include-in-header: fonts.html
